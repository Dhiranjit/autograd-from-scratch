[project]
name = "autograd"
version = "1.0.0"
description = "A minimal autograd engine supporting both scaler and tensor operation with neural network primitives."
dependencies = [
    "numpy",
    "graphviz=0.21"
    ]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
namespaces = true