[project]
name = "autograd-from-scratch"
version = "1.0.0"
description = "A minimal autograd engine supporting both scaler and tensor operation with neural network primitives."
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "graphviz",
    "matplotlib>=3.11.2",
    "ipykernel>=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
